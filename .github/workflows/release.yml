name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI and GitHub Releases
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/claude-nim-proxy
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.9.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Test
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Verify that the tag matches the project version
        run: |
          version="$(uv run python -c 'import claude_nim_proxy; print(claude_nim_proxy.__version__)')"
          tag="${RELEASE_TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag ${RELEASE_TAG} does not match project version ${version}." >&2
            exit 1
          fi
          echo "Releasing version ${version}"

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          python - "$version" > release-notes.md <<'PY'
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          print(match.group(0).strip() if match else f"## {version}")
          PY
          printf '\nFull changelog: https://github.com/%s/blob/main/CHANGELOG.md\n' \
            "$GITHUB_REPOSITORY" >> release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists; refreshing its notes."
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi
