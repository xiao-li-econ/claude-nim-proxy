name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI and GitHub Releases
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/claude-nim-proxy
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.9.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Test
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Verify that the tag matches the project version
        run: |
          version="$(uv run python -c 'import claude_nim_proxy; print(claude_nim_proxy.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}." >&2
            exit 1
          fi
          echo "Releasing version ${version}"

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          python - "$version" > release-notes.md <<'PY'
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          print(match.group(0).strip() if match else f"## {version}")
          PY
          {
            cat release-notes.md
            echo
            echo "Full changelog: https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md"
          } >> release-notes.md
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release-notes.md
